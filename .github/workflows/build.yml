name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb mesa-utils \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEMERALD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # GitHub's Linux runners have no GPU, so the smoke test renders through
      # Mesa's software rasteriser on a virtual display and keeps the frame.
      - name: Render smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./build/emerald-isle --frames 10 --screenshot frame.png

      # Flies over the procedural archipelago so tiles stream continuously; prints frame stats.
      - name: Streaming smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./build/emerald-isle --view archipelago --autofly 5 --no-vsync

      - name: Upload rendered frame
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-frame
          path: frame.png
