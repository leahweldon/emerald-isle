name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch or PR cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb mesa-utils \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      # Only dependency sources and download stamps are cached, not compiled objects, so
      # configure skips the git clones while every build still compiles from scratch.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEMERALD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # Unit tests of the pure logic (no GL context needed), on every platform.
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      # GitHub's Linux runners have no GPU, so the smoke test renders through Mesa's software
      # rasteriser and keeps the frame. Headless runs still need xvfb (24-bit) for the GLX context.
      - name: Render smoke test
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 640x480x24" ./build/emerald-isle --headless \
            --frames 10 --screenshot frame.png

      # Flies with tiles streaming continuously over the procedural archipelago with the panel open,
      # and west over Kerry across the DEM border in heavy rain. Checks correctness, not timing: a
      # runner without a GPU is too noisy for frame times. Fails on GL errors, holes in the terrain,
      # ground missing under the camera, fewer than 100 tiles streamed, a flight that does not
      # complete, or (in rain) a transform feedback step that did not write every drop.
      - name: Streaming test
        if: runner.os == 'Linux'
        run: |
          for flight in "--view archipelago --ui" "--view kerry --rain 1"; do
            xvfb-run -a -s "-screen 0 640x480x24" ./build/emerald-isle --headless $flight \
              --autofly 10 --width 640 --height 360 --validate 100
          done

      - name: Upload rendered frame
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-frame
          path: frame.png
