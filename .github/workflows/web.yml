name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch or PR cancels its run still in progress; deployments queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Set up Python for asset preparation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: |
            build-web/_deps/*-src
            build-web/_deps/*-subbuild
          key: web-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build build-web --parallel

      - name: Collect the site
        run: |
          mkdir -p site
          cp build-web/index.html build-web/index.js build-web/index.wasm build-web/index.data site/
          {
            echo "### Web build download"
            echo "| File | Size | gzip |"
            echo "|---|---|---|"
            for f in site/*; do
              echo "| $(basename "$f") | $(numfmt --to=si --suffix=B "$(stat -c %s "$f")") | $(numfmt --to=si --suffix=B "$(gzip -9 -c "$f" | wc -c)") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Loads the page in headless Chromium (software WebGL 2) and fails on any console or WebGL
      # error, or if the app does not start; then checks that input reaches the app.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Smoke test
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node test/smoke.mjs ../site 10
      # Clicks the scene and presses keys, checking through the app's state that the orbit stops,
      # the camera moves and turns, pointer lock is requested from the click, and the panel toggles.
      - name: Input test
        working-directory: web
        run: node test/input.mjs ../site

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshot
          path: web/test-results/smoke.png
          if-no-files-found: ignore

      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
