<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emerald Isle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101416; }
  #canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<script>
  // URL parameters become options: ?view=shore&rain=1 runs with --view shore --rain 1.
  var args = [];
  new URLSearchParams(location.search).forEach(function (value, key) {
    args.push('--' + key);
    if (value !== '') args.push(value);
  });
  var Module = { canvas: document.getElementById('canvas'), arguments: args };
</script>

</body>
</html>
